<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ grade }} 광고 송출</title><style>body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}#screen{width:100vw;height:100vh;display:grid;place-items:center}#screen img,#screen video{width:100%;height:100%;object-fit:contain}#message{text-align:center;color:#b5bac5}#start{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:16px 24px;border:0;border-radius:12px;font-size:18px;cursor:pointer}</style></head><body><div id="screen"><div id="message">{% if media %}광고를 불러오고 있어요…{% else %}등록된 광고가 없습니다. 잠시 후 다시 확인합니다.{% endif %}</div></div><button id="start" hidden>화면을 눌러 재생 시작</button><script>
const mediaFiles = {{ media|tojson }};
const screen = document.getElementById('screen');
const start = document.getElementById('start');
let index = 0, timer, watchdog, current, failedCurrent = false;
function next() {
  clearTimeout(timer); clearTimeout(watchdog); start.hidden = true;
  if (current) { current.onerror = null; if (current.tagName === 'VIDEO') { current.onended = null; current.pause(); current.removeAttribute('src'); current.load(); } }
  index += 1;
  if (index >= mediaFiles.length) { location.reload(); return; }
  show();
}
function failed() { if (failedCurrent) return; failedCurrent = true; clearTimeout(watchdog); clearTimeout(timer); timer = setTimeout(next, 3000); }
function show() {
  failedCurrent = false;
  const item = mediaFiles[index];
  current = document.createElement(item.type === 'image' ? 'img' : 'video');
  current.onerror = failed;
  watchdog = setTimeout(failed, 30000);
  if (item.type === 'image') {
    current.alt = '학교 광고';
    current.onload = () => { clearTimeout(watchdog); timer = setTimeout(next, 5000); };
  } else {
    current.autoplay = true; current.muted = true; current.playsInline = true;
    current.onended = next;
    current.onplaying = () => { clearTimeout(watchdog); start.hidden = true; };
    current.onwaiting = () => { clearTimeout(watchdog); watchdog = setTimeout(failed, 30000); };
    start.onclick = () => current.play().catch(() => { start.hidden = false; });
  }
  screen.replaceChildren(current);
  current.src = item.src;
  if (item.type === 'video') current.play().catch(error => { if (error.name === 'NotAllowedError') { clearTimeout(watchdog); start.hidden = false; } else failed(); });
}
if (mediaFiles.length) show(); else setTimeout(() => location.reload(), 15000);
</script></body></html>
