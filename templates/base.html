<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}학교 광고 관리{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='reorder.css') }}">
  <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="{{ url_for('home') }}"><span class="brand-icon" aria-hidden="true">▤</span> 학교 광고 <span class="brand-sub">관리실</span></a><span class="local-label">학교 디지털 게시판</span></header>
<main class="shell">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
</body></html>
